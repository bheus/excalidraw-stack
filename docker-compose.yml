services:
  excalidraw:
    # Upstream publishes only :latest for arm64 (versioned sha-* tags are amd64
    # and years old), so pin the digest. Dependabot bumps it.
    image: excalidraw/excalidraw:latest@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
    container_name: excalidraw
    restart: unless-stopped
    networks:
      - caddy
    labels:
      # HTTPS via Caddy's internal CA rather than http:// like most .svc.lan
      # routes: copy-as-PNG and share-link encryption need a secure context.
      - "caddy=excalidraw.svc.lan"
      - "caddy.tls=internal"
      - "caddy.reverse_proxy={{upstreams 80}}"

networks:
  caddy:
    external: true
    name: caddy
