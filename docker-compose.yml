services:
  excalidraw:
    # Built by .github/workflows/ci-release.yml from the pinned submodule.
    image: ghcr.io/bheus/excalidraw:latest
    container_name: excalidraw
    restart: unless-stopped
    networks:
      - caddy
    labels:
      # HTTPS via Caddy's internal CA rather than http:// like most .svc.lan
      # routes: copy-as-PNG and share-link encryption need a secure context.
      - "caddy=excalidraw.svc.lan"
      - "caddy.tls=internal"
      - "caddy.reverse_proxy={{upstreams 80}}"

networks:
  caddy:
    external: true
    name: caddy
